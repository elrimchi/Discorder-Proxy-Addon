[proxy]
; Local SOCKS5 endpoint. The proxy must support UDP.
host=127.0.0.1
port=10808
; Optional SOCKS5 authentication. Leave both empty to connect without it.
username=
password=
tcp=1
udp=1
; Let Chromium resolve hostnames through SOCKS5.
chromium_proxy=1
; Disabled by default. If enabled: one shared file capped at 2 MiB in
; %LOCALAPPDATA%\DiscordProcessProxy\discord-proxy.log (no message contents).
log=0

[addon]
version=1.1.2
