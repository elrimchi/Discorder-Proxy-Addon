name: Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build
        working-directory: native-dll
        run: .\build.cmd
      - name: Check release version
        id: release
        working-directory: native-dll
        run: |
          . .\Manage-Install.ps1
          $version = Get-PackageVersion (Join-Path $PWD 'build/version.dll') (Join-Path $PWD 'discord-proxy.ini')
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package version v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Package
        working-directory: native-dll
        run: python package.py
      - name: Save release package
        uses: actions/upload-artifact@v4
        with:
          name: Discorder-Proxy-Addon-v${{ steps.release.outputs.version }}-windows-x64
          path: Discorder-Proxy-Addon-v${{ steps.release.outputs.version }}.zip
          if-no-files-found: error
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Discorder-Proxy-Addon-v${{ steps.release.outputs.version }}.zip
          generate_release_notes: true
          prerelease: true

